name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@a7afe0a2d717fe23bf93c8d8239d4f43c4a40f02
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@a7afe0a2d717fe23bf93c8d8239d4f43c4a40f02

      - name: Analyze
        uses: github/codeql-action/analyze@a7afe0a2d717fe23bf93c8d8239d4f43c4a40f02
