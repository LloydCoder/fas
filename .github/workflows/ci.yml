name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=fas --cov-report=term-missing --cov-report=xml

      - name: Type check
        run: python -m compileall -q src tests

      - name: Security tests
        run: pytest tests/security

      - name: Dependency audit
        run: python -m pip check

      - name: Secret scan
        run: |
          if command -v gitleaks >/dev/null 2>&1; then gitleaks detect --no-banner --redact; else echo "gitleaks unavailable in CI image"; fi


      - name: Schema parity
        run: python scripts/check_schema_parity.py

      - name: Package build
        run: python -m build

      - name: Clean wheel installation
        run: |
          python -m venv /tmp/fas-clean
          /tmp/fas-clean/bin/python -m pip install --upgrade pip
          /tmp/fas-clean/bin/python -m pip install dist/*.whl
          /tmp/fas-clean/bin/fas --version

      - name: CLI smoke
        run: |
          fas --version
          fas doctor --format json
          fas tools --format json

      - name: API smoke
        run: pytest tests/integration/api

      - name: Reproducibility tests
        run: pytest tests/integration -k "reproduc"

      - name: Product integration smoke
        run: pytest tests/integration/product

      - name: Graph baseline benchmark
        if: matrix.python-version == '3.13'
        run: python benchmarks/graph_baseline.py

      - name: Collection baseline benchmark
        if: matrix.python-version == '3.13'
        run: python benchmarks/collection_baseline.py
