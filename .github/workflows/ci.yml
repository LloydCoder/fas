name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Schema parity
        run: python scripts/check_schema_parity.py

      - name: Package build
        run: python -m build

      - name: Clean wheel installation
        run: |
          python -m venv /tmp/fas-clean
          /tmp/fas-clean/bin/python -m pip install --upgrade pip
          /tmp/fas-clean/bin/python -m pip install dist/*.whl
          /tmp/fas-clean/bin/fas --version

      - name: CLI smoke
        run: |
          fas --version
          fas doctor --format json
          fas tools --format json

      - name: Product integration smoke
        run: pytest tests/integration/product tests/security/test_phase6_product.py

      - name: Graph baseline benchmark
        if: matrix.python-version == '3.13'
        run: python benchmarks/graph_baseline.py

      - name: Collection baseline benchmark
        if: matrix.python-version == '3.13'
        run: python benchmarks/collection_baseline.py

  
  lint-diagnostic:
    name: Lint diagnostic (temporary)
    if: github.repository == 'LloydCoder/fas' && github.head_ref == 'phase6-productization'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Install lint dependency
        run: python -m pip install "ruff>=0.12"
      - name: Publish lint diagnostics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set +e
          ruff check . > /tmp/ruff.txt 2>&1
          status=$?
          python - <<'PY'
          from pathlib import Path
          p=Path("/tmp/ruff.txt")
          text=p.read_text(encoding="utf-8")
          if len(text)>60000:
              text=text[:59000] + "\n...truncated..."
          Path("/tmp/comment.md").write_text("## Temporary FAS lint diagnostics\n\n\\`\\`\\`text\n"+text+"\n\\`\\`\\`",encoding="utf-8")
          PY
          gh pr comment "$PR_URL" --body-file /tmp/comment.md
          exit "$status"
