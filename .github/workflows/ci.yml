name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install uv and set Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest --cov=fas --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Static syntax/type gate
        run: uv run python -m compileall -q src tests

      - name: Type check
        run: uv run mypy src/fas --follow-imports=skip --disable-error-code=arg-type,dict-item,var-annotated,attr-defined

      - name: Security tests
        run: uv run pytest tests/security

      - name: Dependency integrity
        run: uv run python -m pip check

      - name: Dependency vulnerability audit
        run: uv run pip-audit --strict --skip-editable -r ci/requirements-audit.txt

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



      - name: Schema parity
        run: uv run python scripts/check_schema_parity.py

      - name: Package build
        run: uv run python -m build

      - name: Clean wheel installation
        run: |
          python -m venv /tmp/fas-clean
          /tmp/fas-clean/bin/python -m pip install --upgrade pip
          /tmp/fas-clean/bin/python -m pip install dist/*.whl
          /tmp/fas-clean/bin/fas --version

      - name: CLI smoke
        run: |
          fas --version
          fas doctor --format json
          fas tools --format json

      - name: API smoke
        run: uv run pytest tests -k "api"

      - name: End-to-end smoke
        run: uv run pytest tests/e2e

      - name: Reproducibility tests
        run: uv run pytest tests -k "reproduc"

      - name: Product integration smoke
        run: uv run pytest tests/integration/product

      - name: Graph baseline benchmark
        if: matrix.python-version == '3.13'
        run: uv run python benchmarks/graph_baseline.py

      - name: Collection baseline benchmark
        if: matrix.python-version == '3.13'
        run: uv run python benchmarks/collection_baseline.py
