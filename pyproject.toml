 [build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "forensic-agent-security"
version = "0.6.0"
description = "Evidence-first security analysis for AI agents and modern software."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "LloydCoder" }]
keywords = ["cybersecurity", "application-security", "ai-security", "agent-security", "security-analysis", "exploitability", "attack-path"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = ["pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.12", "hypothesis>=6.100", "build>=1.2", "pip-audit>=2.7", "mypy>=1.11"]

[project.scripts]
fas = "fas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fas"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["C408", "DTZ001", "I001", "RUF022", "RUF059", "SIM114", "UP017", "UP037"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
